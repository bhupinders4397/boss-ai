<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOSS AI - Gemma 4</title>

<style>

:root{
--bg:#0b0f19;
--panel:#111827;
--card:#1f2937;
--border:#374151;
--text:#e5e7eb;
--accent:#00f2fe;
--user:#2563eb;
}

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
}


/* SIDEBAR */

.sidebar{
width:280px;
background:#070b12;
border-right:1px solid var(--border);
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}


.logo{
font-size:28px;
font-weight:bold;
color:var(--accent);
text-align:center;
}


.sidebar input,
.sidebar select,
.sidebar button{

padding:12px;
border-radius:8px;
border:1px solid var(--border);
background:#111827;
color:white;

}


.sidebar button{

cursor:pointer;
background:var(--accent);
color:black;
font-weight:bold;

}



/* MAIN */

.main{

flex:1;
display:flex;
flex-direction:column;

}


.chat{

flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;

}



.message{

max-width:80%;
padding:15px;
border-radius:15px;
line-height:1.5;
white-space:pre-wrap;

}


.user{

align-self:flex-end;
background:var(--user);

}


.bot{

align-self:flex-start;
background:var(--card);
border:1px solid var(--border);

}


pre{

background:#000;
padding:10px;
border-radius:8px;
overflow:auto;

}



.copy{

margin-top:8px;
background:#374151;
color:white;
border:0;
padding:5px 10px;
border-radius:5px;
cursor:pointer;

}



/* INPUT */

.input-area{

display:flex;
gap:10px;
padding:15px;
background:#070b12;
border-top:1px solid var(--border);

}



textarea{

flex:1;
height:60px;
resize:none;
padding:15px;
border-radius:10px;
background:#111827;
color:white;
border:1px solid var(--border);

}



.send{

width:100px;
background:var(--accent);
border:0;
border-radius:10px;
font-weight:bold;
cursor:pointer;

}



@media(max-width:700px){

.sidebar{
display:none;
}

.message{
max-width:95%;
}

}

</style>

</head>


<body>


<div class="sidebar">


<div class="logo">
⚡ BOSS AI
</div>


<input id="apiKey"
type="password"
placeholder="OpenRouter API Key">



<select id="model">


<option value="google/gemma-4-26B-A4B-it">
Gemma 4 26B A4B
</option>


<option value="openai/gpt-4o-mini">
GPT-4o Mini
</option>


</select>



<button onclick="saveSettings()">
Save Settings
</button>



<button onclick="newChat()">
New Chat
</button>



<button onclick="clearMemory()">
Clear Memory
</button>


</div>





<div class="main">


<div id="chat" class="chat"></div>



<div class="input-area">


<textarea 
id="input"
placeholder="Message BOSS AI..."></textarea>



<button class="send"
onclick="sendMessage()">

SEND

</button>


</div>


</div>





<script>


// ============================
// BOSS AI ENGINE
// ============================


let messages =
JSON.parse(
localStorage.getItem("boss_memory") || "[]"
);



// Load settings


document.getElementById("apiKey").value =
localStorage.getItem("boss_key") || "";



document.getElementById("model").value =
localStorage.getItem("boss_model") ||
"google/gemma-4-26B-A4B-it";




// Save settings


function saveSettings(){

let key =
document.getElementById("apiKey")
.value.trim();


let model =
document.getElementById("model")
.value;


localStorage.setItem(
"boss_key",
key
);


localStorage.setItem(
"boss_model",
model
);


alert("Saved");

}




// Load chat


function loadChat(){

let box =
document.getElementById("chat");


box.innerHTML="";


messages.forEach(m=>{

addMessage(
m.role==="user" ? "user":"bot",
m.content,
false
);


});


box.scrollTop =
box.scrollHeight;

}


loadChat();






// Add message


function addMessage(type,text,save=true){


let box =
document.getElementById("chat");


let div =
document.createElement("div");


div.className =
"message "+type;


div.innerHTML =
formatText(text);



if(type==="bot"){


let copy =
document.createElement("button");


copy.className="copy";

copy.innerText="COPY";


copy.onclick=()=>{

navigator.clipboard.writeText(text);

copy.innerText="COPIED";


setTimeout(()=>{

copy.innerText="COPY";

},1500);


};


div.appendChild(copy);


}



box.appendChild(div);



if(save){


messages.push({

role:type==="user"
?"user"
:"assistant",

content:text

});



if(messages.length>20){

messages =
messages.slice(-20);

}



localStorage.setItem(
"boss_memory",
JSON.stringify(messages)
);


}



box.scrollTop =
box.scrollHeight;


}







function formatText(text){


text=text
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");


text=text.replace(
/```([\s\S]*?)```/g,
"<pre>$1</pre>"
);


text=text.replace(
/\*\*(.*?)\*\*/g,
"<b>$1</b>"
);


text=text.replace(
/\n/g,
"<br>"
);


return text;

}







function clearMemory(){

if(confirm("Delete all chats?")){


messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();


}

}






function newChat(){

messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();

}







async function sendMessage(){



let input =
document.getElementById("input");


let text =
input.value.trim();



let key =
document.getElementById("apiKey")
.value.trim();




if(!text)
return;



if(!key){

alert("Enter OpenRouter API Key");

return;

}




addMessage(
"user",
text
);



input.value="";



let loading =
document.createElement("div");


loading.id="loading";

loading.className="message bot";

loading.innerHTML="🤖 Thinking...";


document
.getElementById("chat")
.appendChild(loading);





try{


let response =
await fetch(
"https://openrouter.ai/api/v1/chat/completions",
{

method:"POST",

headers:{

"Authorization":
"Bearer "+key,

"Content-Type":
"application/json"

},


body:JSON.stringify({

model:
document
.getElementById("model")
.value,


messages:messages,


temperature:0.7


})


});




let data =
await response.json();




document
.getElementById("loading")
?.remove();




if(data.error){

throw new Error(
data.error.message
);

}



let reply =
data.choices[0]
.message
.content;



addMessage(
"bot",
reply
);



}

catch(err){


document
.getElementById("loading")
?.remove();



addMessage(
"bot",
"❌ "+err.message
);


}


}






document
.getElementById("input")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});



</script>


</body>
</html>
