<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOSS AI - Gemma 4</title>

<style>

:root{
    --bg:#050816;
    --panel:#0f172a;
    --card:#172033;
    --border:#263248;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --accent:#00f2fe;
    --accent2:#4facfe;
    --user:#2563eb;
    --danger:#ef4444;
}


*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


body{

    margin:0;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#12203f,#050816 45%);

    color:var(--text);
    font-family:
    Inter,
    system-ui,
    -apple-system,
    Arial,
    sans-serif;
}



/* APP */

.app{

    height:100vh;
    display:flex;

}



/* SIDEBAR */

.sidebar{

    width:280px;

    background:
    rgba(15,23,42,.85);

    backdrop-filter:blur(15px);

    border-right:
    1px solid var(--border);

    padding:20px;

    display:flex;
    flex-direction:column;

    gap:15px;

}


.logo{

    text-align:center;

    font-size:28px;
    font-weight:900;

    color:var(--accent);

    text-shadow:
    0 0 20px var(--accent);

}



input,
select,
button,
textarea{

    font-family:inherit;

}



.sidebar input,
.sidebar select{

    width:100%;

    padding:13px;

    border-radius:12px;

    background:#111827;

    border:1px solid var(--border);

    color:white;

    outline:none;

}



.sidebar button{

    padding:13px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;

    background:
    linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
    );

    color:#001018;

}



.sidebar button:active{

    transform:scale(.96);

}





/* MAIN CHAT */

.main{

    flex:1;

    display:flex;

    flex-direction:column;

}



.chat{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;

    flex-direction:column;

    gap:14px;

    scroll-behavior:smooth;

}



.message{

    max-width:85%;

    padding:14px 16px;

    border-radius:18px;

    line-height:1.5;

    animation:
    slide .25s ease;

    word-wrap:break-word;

}



@keyframes slide{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:none;

}

}



.user{

    align-self:flex-end;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
    );

    border-bottom-right-radius:5px;

}



.bot{

    align-self:flex-start;

    background:
    rgba(23,32,51,.9);

    border:

    1px solid var(--border);

    border-bottom-left-radius:5px;

}



pre{

    background:#020617;

    padding:12px;

    border-radius:12px;

    overflow:auto;

    font-size:13px;

}



.copy{

    margin-top:10px;

    padding:7px 12px;

    border-radius:8px;

    border:0;

    background:#334155;

    color:white;

    cursor:pointer;

}





/* INPUT AREA */


.input-area{

    padding:12px;

    display:flex;

    gap:10px;

    background:
    rgba(5,8,22,.9);

    backdrop-filter:blur(15px);

    border-top:
    1px solid var(--border);

}



textarea{

    flex:1;

    height:55px;

    resize:none;

    padding:15px;

    border-radius:16px;

    background:#111827;

    border:

    1px solid var(--border);

    color:white;

    outline:none;

}



.send{

    width:90px;

    border:none;

    border-radius:16px;

    font-weight:800;

    background:
    linear-gradient(
    135deg,
    var(--accent),
    var(--accent2)
    );

    cursor:pointer;

}





/* MOBILE */


@media(max-width:700px){


.sidebar{

    position:fixed;

    left:-300px;

    top:0;

    height:100%;

    z-index:10;

    transition:.3s;

}


.sidebar.active{

    left:0;

}


.main{

    width:100%;

}



.chat{

    padding:12px;

}



.message{

    max-width:92%;

}



.input-area{

    padding:
    10px;

}



.send{

    width:70px;

}



}


</style>

</head>


<body>


<div class="app">

  <!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="logo">
        ⚡ BOSS AI
    </div>


    <input
        id="apiKey"
        type="password"
        placeholder="OpenRouter API Key">


    <select id="model">

        <option value="google/gemma-4-26B-A4B-it">
            Gemma 4 26B A4B
        </option>

        <option value="openai/gpt-4o-mini">
            GPT-4o Mini
        </option>

    </select>



    <button onclick="saveSettings()">
        💾 Save Settings
    </button>


    <button onclick="newChat()">
        🆕 New Chat
    </button>


    <button onclick="clearMemory()">
        🗑 Clear Memory
    </button>


</div>




<!-- MAIN -->


<div class="main">


    <div id="chat" class="chat"></div>



    <div class="input-area">


        <textarea
        id="input"
        placeholder="Message BOSS AI..."
        ></textarea>



        <button
        class="send"
        onclick="sendMessage()">

            ➤

        </button>


    </div>


</div>


</div>



<script>

  // ===============================
// BOSS AI ENGINE
// ===============================


let messages =
JSON.parse(
localStorage.getItem("boss_memory") || "[]"
);



const apiKeyInput =
document.getElementById("apiKey");

const modelSelect =
document.getElementById("model");

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");




// Load saved settings

apiKeyInput.value =
localStorage.getItem("boss_key") || "";


modelSelect.value =
localStorage.getItem("boss_model")
||
"google/gemma-4-26B-A4B-it";





// Save settings

function saveSettings(){

let key =
apiKeyInput.value.trim();


let model =
modelSelect.value;


localStorage.setItem(
"boss_key",
key
);


localStorage.setItem(
"boss_model",
model
);


alert("Settings saved ✅");

}







// Load previous chat


function loadChat(){

chat.innerHTML="";


messages.forEach(item=>{


addMessage(
item.role==="user"
?
"user"
:
"bot",

item.content,

false

);


});


chat.scrollTop =
chat.scrollHeight;

}


loadChat();








// Add message


function addMessage(
type,
text,
save=true
){


let div =
document.createElement("div");


div.className =
"message "+type;


div.innerHTML =
formatText(text);



if(type==="bot"){


let copy =
document.createElement("button");


copy.className =
"copy";


copy.innerText =
"📋 COPY";



copy.onclick=function(){


navigator.clipboard.writeText(text);


copy.innerText =
"✅ COPIED";


setTimeout(()=>{

copy.innerText =
"📋 COPY";

},1500);


};



div.appendChild(copy);


}



chat.appendChild(div);



if(save){


messages.push({

role:
type==="user"
?
"user"
:
"assistant",

content:text

});



if(messages.length>30){

messages =
messages.slice(-30);

}



localStorage.setItem(
"boss_memory",
JSON.stringify(messages)

);


}



chat.scrollTop =
chat.scrollHeight;

}







// Text formatter


function formatText(text){


text =
text
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");



text =
text.replace(
/```([\s\S]*?)```/g,

"<pre>$1</pre>"

);



text =
text.replace(
/\*\*(.*?)\*\*/g,

"<b>$1</b>"

);



text =
text.replace(
/\n/g,

"<br>"

);


return text;

}








// Clear memory


function clearMemory(){


if(confirm("Delete all chats?")){


messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();


}

}







// New conversation


function newChat(){


messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();


}









// Send message


async function sendMessage(){


let text =
input.value.trim();


let key =
apiKeyInput.value.trim();



if(!text)
return;



if(!key){

alert(
"Please enter OpenRouter API Key"
);

return;

}




addMessage(
"user",
text
);



input.value="";



let loading =
document.createElement("div");


loading.className =
"message bot";


loading.id =
"loading";


loading.innerHTML =
"🤖 Thinking...";


chat.appendChild(loading);



chat.scrollTop =
chat.scrollHeight;





try{


let response =
await fetch(

"https://openrouter.ai/api/v1/chat/completions",

{

method:"POST",

headers:{

"Authorization":
"Bearer "+key,


"Content-Type":
"application/json"

},


body:JSON.stringify({

model:
modelSelect.value,


messages:messages,


temperature:0.7

})


}

);




let data =
await response.json();





document
.getElementById("loading")
?.remove();




if(data.error){

throw new Error(
data.error.message
);

}





let reply =
data
.choices[0]
.message
.content;



addMessage(
"bot",
reply
);



}

catch(error){



document
.getElementById("loading")
?.remove();



addMessage(

"bot",

"❌ Error: "
+
error.message

);


}



}









// Enter to send


input.addEventListener(

"keydown",

function(e){


if(
e.key==="Enter"
&&
!e.shiftKey
){


e.preventDefault();


sendMessage();


}


}

);




// Mobile sidebar swipe helper

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("active");

}

  </script>

</body>
</html>
