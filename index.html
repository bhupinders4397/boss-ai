<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BOSS AI - Gemma 4</title>


<style>

:root{

--bg:#050816;
--panel:#0f172a;
--card:#172033;
--border:#263248;
--text:#f8fafc;
--accent:#00f2fe;
--accent2:#4facfe;
--user:#2563eb;

}


*{

box-sizing:border-box;
-webkit-tap-highlight-color:transparent;

}


html,body{

margin:0;
width:100%;
height:100%;
overflow:hidden;

font-family:
Inter,
system-ui,
Arial,
sans-serif;

background:var(--bg);
color:white;

}



.app{

width:100%;
height:100dvh;
display:flex;

}




/* SIDEBAR */


.sidebar{

width:280px;

height:100%;

background:
rgba(15,23,42,.95);

border-right:
1px solid var(--border);

padding:20px;

display:flex;

flex-direction:column;

gap:15px;

z-index:100;

}



.logo{

font-size:30px;

font-weight:900;

text-align:center;

color:var(--accent);

text-shadow:
0 0 20px var(--accent);

margin-bottom:10px;

}




.sidebar input,
.sidebar select{

width:100%;

padding:13px;

border-radius:12px;

background:#111827;

border:1px solid var(--border);

color:white;

outline:none;

}




.sidebar button{

padding:13px;

border:0;

border-radius:12px;

font-weight:bold;

cursor:pointer;

background:
linear-gradient(
135deg,
var(--accent),
var(--accent2)
);

color:#001018;

}




/* MAIN */


.main{

flex:1;

height:100%;

display:flex;

flex-direction:column;

min-width:0;

}




.chat{

flex:1;

overflow-y:auto;

padding:18px;

display:flex;

flex-direction:column;

gap:14px;

scroll-behavior:smooth;

padding-bottom:90px;

}





.message{

max-width:85%;

padding:14px 16px;

border-radius:18px;

line-height:1.5;

word-wrap:break-word;

animation:
show .25s ease;

}



@keyframes show{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:none;

}

}




.user{

align-self:flex-end;

background:
linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

border-bottom-right-radius:5px;

}




.bot{

align-self:flex-start;

background:var(--card);

border:1px solid var(--border);

border-bottom-left-radius:5px;

}




pre{

background:#020617;

padding:12px;

border-radius:10px;

overflow:auto;

}




.copy{

margin-top:10px;

padding:7px 12px;

border:0;

border-radius:8px;

background:#334155;

color:white;

}




/* INPUT */


.input-area{

height:75px;

padding:10px;

display:flex;

gap:10px;

background:#050816;

border-top:1px solid var(--border);

}



textarea{

flex:1;

height:55px;

resize:none;

padding:15px;

border-radius:15px;

background:#111827;

border:1px solid var(--border);

color:white;

outline:none;

}



.send{

width:80px;

border:0;

border-radius:15px;

font-weight:900;

background:
linear-gradient(
135deg,
var(--accent),
var(--accent2)
);

}




/* MOBILE */


.menu-btn{

display:none;

}



@media(max-width:700px){



.sidebar{

position:fixed;

left:-300px;

top:0;

width:280px;

height:100dvh;

transition:.3s;

}



.sidebar.active{

left:0;

}



.menu-btn{

display:block;

position:fixed;

top:12px;

left:12px;

z-index:200;

background:var(--accent);

border:0;

border-radius:12px;

padding:10px 14px;

font-size:20px;

}



.chat{

padding:12px;

padding-top:60px;

}



.message{

max-width:95%;

font-size:15px;

}



.input-area{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

z-index:50;

}



textarea{

height:50px;

}



.send{

width:65px;

}



}


</style>
</head>


<body>


<div class="app">



<!-- MOBILE MENU BUTTON -->

<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>





<!-- SIDEBAR -->


<div class="sidebar" id="sidebar">


<div class="logo">
⚡ BOSS AI
</div>




<input
id="apiKey"
type="password"
placeholder="OpenRouter API Key">





<select id="model">


<option value="google/gemma-4-26B-A4B-it">

Gemma 4 26B A4B

</option>



<option value="openai/gpt-4o-mini">

GPT-4o Mini

</option>



</select>







<button onclick="saveSettings()">

💾 Save Settings

</button>






<button onclick="newChat()">

🆕 New Chat

</button>






<button onclick="clearMemory()">

🗑 Clear Memory

</button>




</div>








<!-- MAIN CHAT AREA -->


<div class="main">





<div id="chat" class="chat">

</div>







<div class="input-area">





<textarea

id="input"

placeholder="Message BOSS AI..."

></textarea>







<button

class="send"

onclick="sendMessage()">

➤

</button>






</div>






</div>






</div>






<script>
   // ================================
// BOSS AI ENGINE
// ================================


let messages =
JSON.parse(
localStorage.getItem("boss_memory") || "[]"
);



const apiKey =
document.getElementById("apiKey");


const model =
document.getElementById("model");


const chat =
document.getElementById("chat");


const input =
document.getElementById("input");





// Load settings


apiKey.value =
localStorage.getItem("boss_key") || "";


model.value =
localStorage.getItem("boss_model")
||
"google/gemma-4-26B-A4B-it";







// Save settings


function saveSettings(){


localStorage.setItem(
"boss_key",
apiKey.value.trim()
);



localStorage.setItem(
"boss_model",
model.value
);



alert("Settings Saved ✅");


}








// Load old chat


function loadChat(){


chat.innerHTML="";


messages.forEach(msg=>{


addMessage(

msg.role==="user"
?
"user"
:
"bot",

msg.content,

false

);


});


chat.scrollTop =
chat.scrollHeight;


}



loadChat();









// Add chat bubble


function addMessage(type,text,save=true){



let div =
document.createElement("div");


div.className =
"message "+type;


div.innerHTML =
formatText(text);






if(type==="bot"){



let button =
document.createElement("button");


button.className =
"copy";


button.innerText =
"📋 COPY";



button.onclick=()=>{


navigator.clipboard.writeText(text);


button.innerText =
"COPIED ✅";


setTimeout(()=>{

button.innerText="📋 COPY";

},1500);



};


div.appendChild(button);


}






chat.appendChild(div);





if(save){



messages.push({

role:
type==="user"
?
"user"
:
"assistant",

content:text

});





if(messages.length>30){

messages =
messages.slice(-30);

}





localStorage.setItem(

"boss_memory",

JSON.stringify(messages)

);



}





chat.scrollTop =
chat.scrollHeight;


}









// Format AI response


function formatText(text){



text =
text
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");



text =
text.replace(

/```([\s\S]*?)```/g,

"<pre>$1</pre>"

);



text =
text.replace(

/\*\*(.*?)\*\*/g,

"<b>$1</b>"

);



text =
text.replace(

/\n/g,

"<br>"

);



return text;


}










// Clear chat memory


function clearMemory(){



if(confirm("Delete all messages?")){


messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();


}


}








// New chat


function newChat(){



messages=[];


localStorage.removeItem(
"boss_memory"
);


loadChat();


}









// Sidebar toggle


function toggleSidebar(){


document
.getElementById("sidebar")
.classList.toggle("active");


}









// Send AI request


async function sendMessage(){



let text =
input.value.trim();



let key =
apiKey.value.trim();





if(!text)
return;




if(!key){

alert(
"Enter OpenRouter API Key first"
);

return;

}




addMessage(
"user",
text
);



input.value="";





let loading =
document.createElement("div");


loading.className =
"message bot";


loading.id =
"loading";


loading.innerHTML =
"🤖 Thinking...";



chat.appendChild(loading);







try{


let response =
await fetch(

"https://openrouter.ai/api/v1/chat/completions",

{

method:"POST",


headers:{


"Authorization":
"Bearer "+key,


"Content-Type":
"application/json"


},



body:JSON.stringify({


model:model.value,


messages:messages,


temperature:0.7


})


}


);







let data =
await response.json();





document
.getElementById("loading")
?.remove();







if(data.error){

throw new Error(
data.error.message
);

}







let reply =
data
.choices[0]
.message
.content;






addMessage(
"bot",
reply
);





}

catch(error){



document
.getElementById("loading")
?.remove();



addMessage(

"bot",

"❌ "+error.message

);



}




}









// Enter send


input.addEventListener(

"keydown",

function(e){


if(
e.key==="Enter"
&&
!e.shiftKey
){


e.preventDefault();


sendMessage();


}


}

);


</script>



</body>

</html>
